[project]
name = "mam-ai-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.13.0",
    "bitsandbytes>=0.45.0",
    "fairscale==0.4.13",
    "fastapi==0.110.0",
    "httpx==0.28.1",
    "huggingface-hub>=1.9,<2",
    "insightface==0.7.3",
    "numpy>=1.26.4,<2",
    "onnxruntime-gpu==1.20.1",
    "opencv-python-headless==4.11.0.86",
    "pillow>=12.0",
    "pydantic>=2.12,<3",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.22",
    "qwen-vl-utils>=0.0.8",
    "ram",
    "requests>=2.33",
    "safetensors>=0.7",
    "scipy>=1.15,<2",
    "sentence-transformers>=5.3.0",
    "timm==0.9.16",
    "torch==2.7.1+cu118",
    "torchvision==0.22.1+cu118",
    "transformers==5.5.0",
    "uvicorn==0.27.1",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
ram = { git = "https://github.com/xinyu1205/recognize-anything.git", rev = "7cb804a8609e9f4b1a50b7f31436d2df40bb9481" }
