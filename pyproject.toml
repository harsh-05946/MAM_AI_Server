[project]
name = "mam-ai-server"
version = "0.2.0"
description = "Single-GPU FastAPI inference server for MAM Processing (face, emotion, scene, RAM++, Qwen, Sarvam, embeddings)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.13.0",
    "bitsandbytes>=0.45.0",
    "fairscale==0.4.13",
    "fastapi==0.110.0",
    "httpx==0.28.1",
    "huggingface-hub>=1.9,<2",
    "insightface==0.7.3",
    "numpy>=1.26.4,<2",
    "nvidia-ml-py>=12.535.0",
    "onnxruntime-gpu==1.20.1",
    "opencv-python-headless==4.11.0.86",
    "pillow>=12.0",
    "psutil>=5.9",
    "pydantic>=2.12,<3",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.22",
    "qwen-vl-utils[decord]==0.0.8",
    "ram",
    "requests>=2.33",
    "safetensors>=0.7",
    "scipy>=1.15,<2",
    "sentence-transformers>=5.3.0",
    "timm==0.9.16",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "transformers==5.5.0",
    "uvicorn==0.27.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
ram = { git = "https://github.com/xinyu1205/recognize-anything.git", rev = "7cb804a8609e9f4b1a50b7f31436d2df40bb9481" }

[tool.uv]
# Prefer CUDA 12.6 wheels from the pytorch-cu126 index for torch/torchvision.
package = false
