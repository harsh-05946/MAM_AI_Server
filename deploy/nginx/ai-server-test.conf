# Optimized single-backend AI server (phase-1 throughput work).
# Public port 9000 → one Uvicorn on 127.0.0.1:9001.
# Buffering defaults intentionally unchanged; only timing log + single upstream.

log_format ai_timing '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     'rt=$request_time urt=$upstream_response_time '
                     'ua=$upstream_addr rl=$request_length '
                     'rid=$http_x_request_id run=$http_x_run_id '
                     'media=$http_x_media_id job=$http_x_job_id';

upstream ai_server_instances {
    server 127.0.0.1:9001 max_fails=2 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 9000;
    server_name _;

    client_max_body_size 1g;

    access_log /var/log/nginx/ai_server_access.log ai_timing;

    location / {
        proxy_pass http://ai_server_instances;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Run-ID $http_x_run_id;
        proxy_set_header X-Media-ID $http_x_media_id;
        proxy_set_header X-Job-ID $http_x_job_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;

        add_header X-AI-Upstream $upstream_addr always;
        add_header X-AI-Upstream-Time $upstream_response_time always;
    }
}
