user ubuntu;
worker_processes  1;
error_log /home/ubuntu/MAM_AI_Server/nginx-run/error.log warn;
pid /home/ubuntu/MAM_AI_Server/nginx-run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log /home/ubuntu/MAM_AI_Server/nginx-run/access.log;
  client_body_temp_path /home/ubuntu/MAM_AI_Server/nginx-run/client_body_temp;

  sendfile        on;
  keepalive_timeout  65;

  # Large uploads for images/audio; tune as needed.
  client_max_body_size 50m;

  # Upstream is the RouterAPI.
  upstream router_upstream {
    server 127.0.0.1:9000;
    keepalive 32;
  }

  server {
    listen 8000;

    # Inference can be slow; tune based on worst-case.
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Preserve request bodies (multipart) reliably.
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://router_upstream;
    }
  }
}

